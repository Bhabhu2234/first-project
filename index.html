<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudySync Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @custom-variant dark (&:where(.dark, .dark *));
        
        .time-track-scrollbar::-webkit-scrollbar {
            width: 5px;
        }
        .time-track-scrollbar::-webkit-scrollbar-track {
            background: rgba(31, 41, 55, 0.5);
            border-radius: 4px;
        }
        .time-track-scrollbar::-webkit-scrollbar-thumb {
            background: #4f46e5;
            border-radius: 4px;
        }
        .drag-handle {
            cursor: move;
        }
    </style>
    
    <script>
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
</head>
<body class="bg-black dark:bg-black font-sans min-h-screen transition-colors duration-200 pb-40 lg:pb-6 relative">

    <div class="fixed bottom-4 right-4 z-50 flex flex-col items-end gap-3 select-none">
        
        <div id="draggable-reminder-container" class="flex flex-col items-end gap-2 md:max-w-xs w-full max-w-[calc(100%-2rem)] md:w-80">
            <button id="reminder-bubble-btn" onclick="toggleReminderWidget(false)" class="w-16 h-16 bg-amber-500 hover:bg-amber-600 text-gray-950 rounded-full flex flex-col items-center justify-center shadow-2xl border border-amber-400 transition transform hover:scale-105 active:scale-95 cursor-pointer gap-0.5 shrink-0">
                <i class="fa-solid fa-bell text-xl animate-swing"></i>
                <span class="text-[9px] font-bold uppercase tracking-wider">Reminder</span>
            </button>

            <div id="floating-reminder-card" class="hidden w-full bg-gray-900 dark:bg-gray-950 p-4 rounded-xl shadow-2xl border border-amber-500/30 transition-colors duration-200 text-left">
                <div id="reminder-drag-handle" class="drag-handle flex justify-between items-center bg-gray-950 p-2 -mx-4 -mt-4 rounded-t-xl border-b border-gray-800 mb-3 text-gray-400">
                    <span class="text-xs font-bold text-gray-200 uppercase tracking-wide flex items-center gap-2">
                        <i class="fa-solid fa-grip-vertical text-gray-600 text-sm"></i> Quick Reminder
                    </span>
                    <button onclick="toggleReminderWidget(true)" class="text-gray-500 hover:text-gray-200 text-xs px-1 cursor-pointer">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
                
                <div class="flex bg-gray-950 p-1 rounded-lg border border-gray-800 mb-3 text-xs">
                    <button type="button" onclick="switchReminderMode('clock')" id="rem-mode-clock" class="flex-1 py-1.5 rounded font-medium transition cursor-pointer bg-amber-500 text-white">
                        <i class="fa-regular fa-clock mr-1"></i> Time
                    </button>
                    <button type="button" onclick="switchReminderMode('duration')" id="rem-mode-duration" class="flex-1 py-1.5 rounded font-medium transition cursor-pointer text-gray-400 hover:text-gray-200">
                        <i class="fa-solid fa-hourglass-half mr-1"></i> Countdown
                    </button>
                </div>

                <div class="space-y-3">
                    <input type="text" id="rem-text" placeholder="Remind me to..." class="w-full bg-gray-800 dark:bg-gray-900 border border-gray-700 rounded-lg p-2 text-xs text-gray-100 focus:ring-2 focus:ring-amber-500 focus:outline-none">
                    
                    <div>
                        <div id="rem-clock-input-wrapper">
                            <label class="block text-[10px] font-medium text-gray-400 uppercase tracking-wider mb-1">Set Time</label>
                            <input type="time" id="rem-clock-time" class="w-full bg-gray-800 dark:bg-gray-900 border border-gray-700 rounded-lg p-2 text-xs text-gray-100 focus:ring-2 focus:ring-amber-500 focus:outline-none">
                        </div>

                        <div id="rem-duration-input-wrapper" class="hidden">
                            <label class="block text-[10px] font-medium text-gray-400 uppercase tracking-wider mb-1">Trigger in</label>
                            <div class="grid grid-cols-3 gap-1.5">
                                <div>
                                    <input type="number" id="rem-hours" min="0" value="0" class="w-full bg-gray-800 dark:bg-gray-900 border border-gray-700 rounded-lg p-1.5 text-center text-xs text-gray-100 focus:ring-2 focus:ring-amber-500 focus:outline-none">
                                    <span class="block text-[9px] text-gray-500 text-center mt-1">hours</span>
                                </div>
                                <div>
                                    <input type="number" id="rem-minutes" min="0" max="59" value="5" class="w-full bg-gray-800 dark:bg-gray-900 border border-gray-700 rounded-lg p-1.5 text-center text-xs text-gray-100 focus:ring-2 focus:ring-amber-500 focus:outline-none">
                                    <span class="block text-[9px] text-gray-500 text-center mt-1">mins</span>
                                </div>
                                <div>
                                    <input type="number" id="rem-seconds" min="0" max="59" value="0" class="w-full bg-gray-800 dark:bg-gray-900 border border-gray-700 rounded-lg p-1.5 text-center text-xs text-gray-100 focus:ring-2 focus:ring-amber-500 focus:outline-none">
                                    <span class="block text-[9px] text-gray-500 text-center mt-1">secs</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <button onclick="setReminder()" class="w-full bg-amber-500 hover:bg-amber-600 text-gray-950 font-bold text-xs p-2 rounded-lg transition cursor-pointer">
                        Set Notification Timer
                    </button>
                </div>
            </div>
        </div>

        <div id="draggable-calendar-container" class="flex flex-col items-end gap-2 md:flex hidden">
            <button id="calendar-bubble-btn" onclick="toggleCalendarWidget(false)" class="w-16 h-16 bg-indigo-600 hover:bg-indigo-700 text-white rounded-full flex flex-col items-center justify-center shadow-2xl border border-indigo-500 transition transform hover:scale-105 active:scale-95 cursor-pointer gap-0.5">
                <i class="fa-solid fa-calendar-days text-xl"></i>
                <span class="text-[9px] font-bold uppercase tracking-wider">Calendar</span>
            </button>

            <div id="desktop-calendar-widget" class="hidden w-80 bg-gray-900 dark:bg-gray-950 border border-gray-800 shadow-2xl rounded-xl overflow-hidden text-left">
                <div id="calendar-drag-handle" class="drag-handle bg-indigo-950/60 dark:bg-black/80 px-4 py-2.5 border-b border-gray-800 flex justify-between items-center">
                    <div class="flex items-center gap-2">
                        <i class="fa-solid fa-grip-vertical text-gray-600 text-sm"></i>
                        <div>
                            <span id="widget-title" class="text-xs font-bold text-gray-100 block tracking-wide uppercase"></span>
                            <span id="widget-subtitle" class="text-[10px] text-indigo-400 font-medium"></span>
                        </div>
                    </div>
                    
                    <div class="flex items-center gap-2">
                        <div class="flex bg-gray-800 border border-gray-700/60 p-0.5 rounded-md text-[10px]">
                            <button onclick="switchWidgetView('month')" id="tab-month" class="px-2 py-1 rounded font-medium transition cursor-pointer bg-indigo-600 text-white">Month</button>
                            <button onclick="switchWidgetView('day')" id="tab-day" class="px-2 py-1 rounded font-medium transition cursor-pointer text-gray-400 hover:text-gray-200">Day Track</button>
                        </div>
                        <button onclick="toggleCalendarWidget(true)" class="text-gray-400 hover:text-white text-xs p-1 cursor-pointer" title="Minimize to Bubble">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>
                </div>
                
                <div class="p-3">
                    <div id="view-month-container">
                        <div class="grid grid-cols-7 gap-1 text-center text-[10px] font-semibold text-gray-500 mb-1">
                            <div>S</div><div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div>
                        </div>
                        <div id="calendar-days-grid" class="grid grid-cols-7 gap-1 text-center text-xs font-medium mb-3"></div>
                        <div class="border-t border-gray-800/80 pt-2">
                            <p class="text-[9px] font-bold text-gray-500 uppercase tracking-wider mb-1"><i class="fa-solid fa-list-ul"></i> View Day Agenda Summary</p>
                            <div id="widget-mini-agenda" class="space-y-1 max-h-16 overflow-y-auto time-track-scrollbar pr-0.5 text-[11px] text-gray-400"></div>
                        </div>
                    </div>

                    <div id="view-day-container" class="hidden">
                        <div id="widget-allday-banner-wrapper" class="mb-2 space-y-1 hidden"></div>
                        <div class="max-h-64 overflow-y-auto time-track-scrollbar bg-gray-950/40 p-2 rounded-lg border border-gray-800/60 relative">
                            <div id="hourly-timeline-container" class="relative" style="height: 960px;"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <nav class="bg-indigo-950 dark:bg-black text-white shadow-md p-4 border-b border-gray-800 transition-colors duration-200">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-graduation-cap"></i> StudySync Dashboard
            </h1>
            <div class="flex items-center gap-4">
                <span class="text-sm bg-indigo-900 dark:bg-gray-900 px-3 py-1 rounded-full hidden sm:inline" id="live-clock"></span>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <div class="space-y-6">
            <div class="bg-gray-900 dark:bg-gray-950 p-5 rounded-xl shadow-sm border border-gray-800 transition-colors duration-200">
                <h2 class="text-lg font-semibold text-gray-100 dark:text-gray-100 mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-calendar-plus text-indigo-400"></i> Add New Activity
                </h2>
                <form id="activity-form" class="space-y-3">
                    <div>
                        <label class="block text-xs font-medium text-gray-400 uppercase tracking-wider mb-1">Category</label>
                        <select id="act-category" class="w-full bg-gray-800 dark:bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-sm text-gray-100 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                            <option value="Homework">📝 Homework</option>
                            <option value="Self-Study">🧠 Self-Study</option>
                            <option value="Tuition">💻 Tuition</option>
                            <option value="Free Time">🎮 Free Time</option>
                            <option value="Others">📌 Others</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-400 uppercase tracking-wider mb-1">Activity Name / Subject</label>
                        <input type="text" id="act-name" placeholder="e.g., Exam Revision" required class="w-full bg-gray-800 dark:bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-sm text-gray-100 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                    
                    <div>
                        <label class="block text-xs font-medium text-gray-400 uppercase tracking-wider mb-1 flex justify-between">
                            <span>Priority Level <span class="text-gray-600 lowercase italic">(optional)</span></span>
                        </label>
                        <select id="act-priority" class="w-full bg-gray-800 dark:bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-sm text-gray-100 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                            <option value="">-- No Priority Assigned --</option>
                            <option value="1">Priority 1 (High - Red)</option>
                            <option value="2">Priority 2 (Medium - Orange)</option>
                            <option value="3">Priority 3 (Low - Blue)</option>
                        </select>
                    </div>
                    
                    <div class="space-y-3 bg-gray-950/40 border border-gray-800/80 p-3 rounded-lg">
                        <div>
                            <div class="flex justify-between items-center mb-1">
                                <label class="block text-xs font-medium text-gray-400 uppercase tracking-wider">Target Day</label>
                                <label class="flex items-center gap-1 text-[11px] text-indigo-400 font-medium cursor-pointer select-none">
                                    <input type="checkbox" id="act-allday" onchange="toggleAllDayOption(this.checked)" class="h-3 w-3 rounded text-indigo-600 border-gray-700 bg-gray-900 focus:ring-0 cursor-pointer">
                                    Full day
                                </label>
                            </div>
                            <input type="date" id="act-date" required class="w-full bg-gray-800 dark:bg-gray-900 border border-gray-700 rounded-lg p-2 text-xs text-gray-100 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        </div>
                        
                        <div class="grid grid-cols-2 gap-2" id="time-inputs-container">
                            <div>
                                <label class="block text-[11px] font-medium text-gray-400 uppercase tracking-wider mb-1">From <span class="text-gray-600 lowercase italic">(opt)</span></label>
                                <input type="time" id="act-from-time" class="w-full bg-gray-800 dark:bg-gray-900 border border-gray-700 rounded-lg p-2 text-xs text-gray-100 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                            </div>
                            <div>
                                <label class="block text-[11px] font-medium text-gray-400 uppercase tracking-wider mb-1">To / Deadline <span class="text-gray-600 lowercase italic">(opt)</span></label>
                                <input type="time" id="act-to-time" class="w-full bg-gray-800 dark:bg-gray-900 border border-gray-700 rounded-lg p-2 text-xs text-gray-100 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                            </div>
                        </div>
                    </div>
                    <button type="submit" class="w-full bg-indigo-700 hover:bg-indigo-600 text-white font-medium text-sm p-2.5 rounded-lg transition mt-2 cursor-pointer">
                        Add to Schedule
                    </button>
                </form>
            </div>
        </div>

        <div class="bg-gray-900 dark:bg-gray-950 p-5 rounded-xl shadow-sm border border-gray-800 lg:col-span-1 transition-colors duration-200">
            <h2 class="text-lg font-semibold text-gray-100 dark:text-gray-100 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-clock text-emerald-400"></i> Overall Schedule List
            </h2>
            <div id="schedule-list" class="space-y-3 max-h-[600px] overflow-y-auto pr-1"></div>
        </div>

        <div class="bg-gray-900 dark:bg-gray-950 p-5 rounded-xl shadow-sm border border-gray-800 transition-colors duration-200">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-semibold text-gray-100 dark:text-gray-100 flex items-center gap-2">
                    <i class="fa-solid fa-book text-rose-400"></i> Syllabus Tracker
                </h2>
                <button onclick="toggleSyllabusForm()" class="text-xs text-indigo-400 hover:underline font-medium cursor-pointer">
                    + Add Topic
                </button>
            </div>

            <div id="syllabus-form-container" class="hidden bg-gray-800 dark:bg-gray-900 p-3 rounded-lg border border-gray-700 mb-4 space-y-2">
                <input type="text" id="syl-subject" placeholder="Subject (e.g., Chemistry)" class="w-full bg-gray-900 dark:bg-gray-950 border border-gray-700 rounded p-2 text-xs text-gray-100 focus:outline-none">
                <input type="text" id="syl-topic" placeholder="Topic / Chapter Name" class="w-full bg-gray-900 dark:bg-gray-950 border border-gray-700 rounded p-2 text-xs text-gray-100 focus:outline-none">
                <button onclick="addSyllabusItem()" class="w-full bg-gray-950 dark:bg-black text-white text-xs p-2 rounded font-medium cursor-pointer border border-gray-700">Save Topic</button>
            </div>

            <div id="syllabus-list" class="space-y-4 max-h-[600px] overflow-y-auto pr-1"></div>
        </div>
    </main>

    <div class="md:hidden max-w-7xl mx-auto p-4 pt-0 space-y-4">
        <div class="bg-gray-900 dark:bg-gray-950 border border-gray-800 shadow-sm rounded-xl p-4">
            <div class="flex justify-between items-center border-b border-gray-800 pb-2 mb-3">
                <span id="mobile-month-title" class="text-sm font-bold text-gray-200 uppercase tracking-wide"></span>
                <span class="text-xs text-indigo-400 font-medium">Select a day below</span>
            </div>
            <div class="grid grid-cols-7 gap-1 text-center text-[10px] font-semibold text-gray-500 mb-1">
                <div>S</div><div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div>
            </div>
            <div id="mobile-calendar-days-grid" class="grid grid-cols-7 gap-1 text-center text-xs font-medium"></div>
        </div>

        <div class="bg-gray-900 dark:bg-gray-950 border border-gray-800 shadow-sm rounded-xl p-4">
            <div class="flex justify-between items-center border-b border-gray-800 pb-2 mb-3">
                <span id="mobile-day-title" class="text-sm font-bold text-gray-100 uppercase tracking-wide">Day Timeline</span>
                <i class="fa-regular fa-clock text-indigo-400 text-sm"></i>
            </div>
            <div id="mobile-allday-banner-wrapper" class="mb-2 space-y-1 hidden"></div>
            <div class="max-h-80 overflow-y-auto time-track-scrollbar bg-gray-950/40 p-2 rounded-lg border border-gray-800/60 relative">
                <div id="mobile-hourly-timeline-container" class="relative" style="height: 960px;"></div>
            </div>
        </div>
    </div>

    <audio id="alarm-sound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-500.wav" preload="auto"></audio>

    <script>
        let schedule = JSON.parse(localStorage.getItem('study_schedule')) || [];
        let syllabus = JSON.parse(localStorage.getItem('study_syllabus')) || [];
        let activeWidgetView = 'month'; 
        let selectedDateContext = new Date();
        let currentReminderMode = 'clock'; 

        document.getElementById('act-date').value = new Date().toISOString().split('T')[0];
        
        const timeNowPlaceholder = new Date();
        document.getElementById('rem-clock-time').value = `${String(timeNowPlaceholder.getHours()).padStart(2, '0')}:${String(timeNowPlaceholder.getMinutes()).padStart(2, '0')}`;

        function toggleReminderWidget(minimize) {
            const bubble = document.getElementById('reminder-bubble-btn');
            const card = document.getElementById('floating-reminder-card');
            if (minimize) {
                card.classList.add('hidden');
                bubble.classList.remove('hidden');
            } else {
                card.classList.remove('hidden');
                bubble.classList.add('hidden');
            }
        }

        function toggleCalendarWidget(minimize) {
            const bubble = document.getElementById('calendar-bubble-btn');
            const widget = document.getElementById('desktop-calendar-widget');
            if (minimize) {
                widget.classList.add('hidden');
                bubble.classList.remove('hidden');
            } else {
                widget.classList.remove('hidden');
                bubble.classList.add('hidden');
            }
        }

        function createDraggableSystem(containerElement, handleElement) {
            let isDragging = false;
            let currentX, currentY, initialX, initialY;
            let xOffset = 0, yOffset = 0;

            handleElement.addEventListener('mousedown', dragStart);
            document.addEventListener('mousemove', drag);
            document.addEventListener('mouseup', dragEnd);

            handleElement.addEventListener('touchstart', dragStart, { passive: true });
            document.addEventListener('touchmove', drag, { passive: false });
            document.addEventListener('touchend', dragEnd);

            function dragStart(e) {
                let event = e.touches ? e.touches[0] : e;
                initialX = event.clientX - xOffset;
                initialY = event.clientY - yOffset;
                if (e.target === handleElement || handleElement.contains(e.target)) {
                    isDragging = true;
                }
            }

            function drag(e) {
                if (!isDragging) return;
                if (e.cancelable) e.preventDefault();
                let event = e.touches ? e.touches[0] : e;
                currentX = event.clientX - initialX;
                currentY = event.clientY - initialY;
                xOffset = currentX;
                yOffset = currentY;
                containerElement.style.transform = `translate3d(${currentX}px, ${currentY}px, 0px)`;
            }

            function dragEnd() {
                initialX = currentX;
                initialY = currentY;
                isDragging = false;
            }
        }

        createDraggableSystem(document.getElementById('draggable-reminder-container'), document.getElementById('reminder-drag-handle'));
        createDraggableSystem(document.getElementById('draggable-calendar-container'), document.getElementById('calendar-drag-handle'));

        function toggleAllDayOption(isAllDayChecked) {
            const fromInput = document.getElementById('act-from-time');
            const toInput = document.getElementById('act-to-time');
            const box = document.getElementById('time-inputs-container');
            
            if (isAllDayChecked) {
                fromInput.value = "";
                toInput.value = "";
                fromInput.disabled = true;
                toInput.disabled = true;
                box.classList.add('opacity-30', 'cursor-not-allowed');
            } else {
                fromInput.disabled = false;
                toInput.disabled = false;
                box.classList.remove('opacity-30', 'cursor-not-allowed');
            }
        }

        setInterval(() => {
            const now = new Date();
            document.getElementById('live-clock').innerText = now.toLocaleTimeString([], {
                hour: '2-digit', 
                minute: '2-digit', 
                second: '2-digit',
                hour12: false
            });
            updateTimeTrackerLine();
        }, 1000);

        document.getElementById('activity-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const category = document.getElementById('act-category').value;
            const name = document.getElementById('act-name').value;
            const priority = document.getElementById('act-priority').value; 
            const date = document.getElementById('act-date').value;
            const isAllDay = document.getElementById('act-allday').checked;
            
            let fromTime = document.getElementById('act-from-time').value;
            let toTime = document.getElementById('act-to-time').value;

            schedule.push({ 
                id: Date.now(), 
                category, 
                name, 
                priority, 
                date, 
                fromTime: isAllDay ? '' : fromTime, 
                toTime: isAllDay ? '' : toTime, 
                isAllDay, 
                completed: false 
            });
            
            saveAndRender();
            this.reset();
            toggleAllDayOption(false);
            document.getElementById('act-date').value = new Date().toISOString().split('T')[0];
        });

        function toggleTask(id) {
            schedule = schedule.map(item => item.id === id ? { ...item, completed: !item.completed } : item);
            saveAndRender();
        }

        function deleteTask(id) {
            schedule = schedule.filter(item => item.id !== id);
            saveAndRender();
        }

        function getCategoryStyles(category) {
            return {
                'Homework': 'bg-blue-950/80 text-blue-300 border-blue-800 border-l-4 border-l-blue-500 shadow-md',
                'Self-Study': 'bg-purple-950/80 text-purple-300 border-purple-800 border-l-4 border-l-purple-500 shadow-md',
                'Tuition': 'bg-emerald-950/80 text-emerald-300 border-emerald-900 border-l-4 border-l-emerald-500 shadow-md',
                'Free Time': 'bg-amber-950/80 text-amber-300 border-amber-800 border-l-4 border-l-amber-500 shadow-md',
                'Others': 'bg-slate-800 text-slate-300 border-slate-700 border-l-4 border-l-slate-400'
            }[category] || 'bg-gray-800 border-gray-700';
        }

        function getPriorityBadgeMarkup(priority) {
            if (!priority) return '';
            const layouts = {
                '1': 'bg-rose-950 text-rose-400 border-rose-800 text-[9px] px-1 rounded uppercase font-bold',
                '2': 'bg-orange-950 text-orange-400 border-orange-800 text-[9px] px-1 rounded uppercase font-bold',
                '3': 'bg-blue-950 text-blue-400 border-blue-900 text-[9px] px-1 rounded uppercase font-bold'
            };
            return `<span class="border ${layouts[priority] || ''}">P${priority}</span>`;
        }

        function formatDisplayTime(item) {
            if (item.isAllDay) {
                return `<span class="bg-indigo-950 text-indigo-300 border border-indigo-900 font-bold px-1.5 py-0.5 rounded text-[10px] uppercase tracking-wide"><i class="fa-solid fa-bolt text-[9px]"></i> Full Day</span>`;
            }
            if (!item.fromTime && item.toTime) {
                return `<span class="text-rose-400 font-medium"><i class="fa-solid fa-triangle-exclamation text-[10px]"></i> Deadline: ${item.toTime}</span>`;
            }
            if (item.fromTime && !item.toTime) {
                return `<i class="fa-regular fa-clock text-[10px]"></i> Starts at ${item.fromTime}`;
            }
            if (item.fromTime && item.toTime) {
                return `<i class="fa-regular fa-clock text-[10px]"></i> ${item.fromTime} - ${item.toTime}`;
            }
            return `<span class="text-gray-500 italic text-xs">Anytime</span>`;
        }

        function renderSchedule() {
            const list = document.getElementById('schedule-list');
            if (schedule.length === 0) {
                list.innerHTML = `<p class="text-gray-500 text-sm text-center py-6">Your schedule is empty.</p>`;
                return;
            }

            schedule.sort((a, b) => {
                if (a.date !== b.date) return a.date.localeCompare(b.date);
                const pA = a.priority ? parseInt(a.priority) : 99;
                const pB = b.priority ? parseInt(b.priority) : 99;
                if (pA !== pB) return pA - pB;
                if (a.isAllDay) return -1;
                if (b.isAllDay) return 1;
                return (a.fromTime || a.toTime || '00:00').localeCompare(b.fromTime || b.toTime || '00:00');
            });

            list.innerHTML = schedule.map(item => {
                const badgeStyle = getCategoryStyles(item.category);
                const formattedItemDate = new Date(item.date).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                const displayTimeStr = formatDisplayTime(item);
                const priorityBadge = getPriorityBadgeMarkup(item.priority);

                return `
                    <div class="flex items-center justify-between p-3 rounded-lg border border-gray-800 ${item.completed ? 'bg-gray-900/50 opacity-40' : 'bg-gray-800 dark:bg-gray-900/60 shadow-xs'} transition text-left">
                        <div class="flex items-start gap-3">
                            <input type="checkbox" ${item.completed ? 'checked' : ''} onclick="toggleTask(${item.id})" class="mt-1 h-4 w-4 rounded text-indigo-600 focus:ring-indigo-500 border-gray-700 bg-gray-900 cursor-pointer">
                            <div>
                                <div class="flex items-center gap-2">
                                    <p class="text-sm font-medium text-gray-100 ${item.completed ? 'line-through text-gray-500' : ''}">${item.name}</p>
                                    ${priorityBadge}
                                </div>
                                <div class="flex items-center gap-2 mt-1.5 flex-wrap">
                                    <span class="text-[10px] px-2 py-0.5 rounded-full border ${badgeStyle}">${item.category}</span>
                                    <span class="text-xs text-indigo-300 font-medium"><i class="fa-regular fa-calendar text-[10px]"></i> ${formattedItemDate}</span>
                                    <span class="text-xs text-gray-400">${displayTimeStr}</span>
                                </div>
                            </div>
                        </div>
                        <button onclick="deleteTask(${item.id})" class="text-gray-600 hover:text-rose-400 p-1 rounded transition cursor-pointer"><i class="fa-regular fa-trash-can text-sm"></i></button>
                    </div>
                `;
            }).join('');
        }

        function toggleSyllabusForm() {
            const container = document.getElementById('syllabus-form-container');
            container.classList.toggle('hidden');
        }

        function addSyllabusItem() {
            const subject = document.getElementById('syl-subject').value.trim();
            const topic = document.getElementById('syl-topic').value.trim();
            if (!subject || !topic) return alert("Please fill out both Subject and Topic fields!");

            syllabus.push({ id: Date.now(), subject, topic, status: 'Not Started' });
            document.getElementById('syl-subject').value = '';
            document.getElementById('syl-topic').value = '';
            toggleSyllabusForm();
            saveAndRender();
        }

        function renderSyllabus() {
            const container = document.getElementById('syllabus-list');
            if (!container) return;
            if (syllabus.length === 0) {
                container.innerHTML = `<p class="text-gray-500 text-sm text-center py-6">No topics added yet.</p>`;
                return;
            }
            
            container.innerHTML = syllabus.map(item => {
                let badgeColor = "bg-gray-800 text-gray-400 border-gray-700";
                if (item.status === 'In Progress') badgeColor = "bg-orange-950 text-orange-400 border-orange-800";
                if (item.status === 'Completed') badgeColor = "bg-emerald-950 text-emerald-400 border-emerald-900 opacity-60";
                
                return `
                    <div class="flex items-center justify-between p-3 rounded-lg border border-gray-800 bg-gray-800 dark:bg-gray-900/60 text-left">
                        <div class="space-y-0.5 max-w-[70%]">
                            <span class="text-[10px] font-bold text-indigo-400 tracking-wide uppercase">${item.subject}</span>
                            <h4 class="text-sm font-medium text-gray-200 truncate ${item.status === 'Completed' ? 'line-through text-gray-500' : ''}">${item.topic}</h4>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="cycleSyllabusStatus(${item.id})" class="text-[11px] font-medium border px-2.5 py-1 rounded-md transition cursor-pointer ${badgeColor}">
                                ${item.status}
                            </button>
                            <button onclick="deleteSyllabusItem(${item.id})" class="text-gray-600 hover:text-rose-400 p-1 rounded transition cursor-pointer">
                                <i class="fa-regular fa-trash-can text-sm"></i>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function cycleSyllabusStatus(id) {
            syllabus = syllabus.map(item => {
                if (item.id === id) {
                    const nextStatus = item.status === 'Not Started' ? 'In Progress' : (item.status === 'In Progress' ? 'Completed' : 'Not Started');
                    return { ...item, status: nextStatus };
                }
                return item;
            });
            saveAndRender();
        }

        function deleteSyllabusItem(id) {
            syllabus = syllabus.filter(item => item.id !== id);
            saveAndRender();
        }

        function switchReminderMode(mode) {
            currentReminderMode = mode;
            const clockWrapper = document.getElementById('rem-clock-input-wrapper');
            const durationWrapper = document.getElementById('rem-duration-input-wrapper');
            const btnClock = document.getElementById('rem-mode-clock');
            const btnDuration = document.getElementById('rem-mode-duration');
            
            if (mode === 'clock') {
                clockWrapper.classList.remove('hidden');
                durationWrapper.classList.add('hidden');
                btnClock.className = "flex-1 py-1.5 rounded font-medium transition cursor-pointer bg-amber-500 text-white";
                btnDuration.className = "flex-1 py-1.5 rounded font-medium transition cursor-pointer text-gray-400 hover:text-gray-200";
            } else {
                clockWrapper.classList.add('hidden');
                durationWrapper.classList.remove('hidden');
                btnClock.className = "flex-1 py-1.5 rounded font-medium transition cursor-pointer text-gray-400 hover:text-gray-200";
                btnDuration.className = "flex-1 py-1.5 rounded font-medium transition cursor-pointer bg-amber-500 text-white";
            }
        }

        let reminderTimeout = null;
        function setReminder() {
            const text = document.getElementById('rem-text').value.trim() || "Study reminder alert!";
            let delayMs = 0;
            
            if (currentReminderMode === 'clock') {
                const timeVal = document.getElementById('rem-clock-time').value;
                if (!timeVal) return alert("Please select a target time!");
                const [hours, minutes] = timeVal.split(':').map(Number);
                const now = new Date();
                const target = new Date();
                target.setHours(hours, minutes, 0, 0);
                if (target <= now) {
                    target.setDate(target.getDate() + 1);
                }
                delayMs = target - now;
            } else {
                const hours = parseInt(document.getElementById('rem-hours').value) || 0;
                const mins = parseInt(document.getElementById('rem-minutes').value) || 0;
                const secs = parseInt(document.getElementById('rem-seconds').value) || 0;
                delayMs = ((hours * 3600) + (mins * 60) + secs) * 1000;
                if (delayMs <= 0) return alert("Please enter a valid future duration!");
            }
            
            if (reminderTimeout) clearTimeout(reminderTimeout);
            
            alert(`Reminder configured successfully! Triggers in ${Math.round(delayMs / 1000)}s.`);
            toggleReminderWidget(true);
            
            reminderTimeout = setTimeout(() => {
                const alarm = document.getElementById('alarm-sound');
                if (alarm) alarm.play().catch(e => console.log("Audio deferred: ", e));
                alert(`🔔 Quick Reminder: ${text}`);
            }, delayMs);
        }

        function switchWidgetView(view) {
            activeWidgetView = view;
            const monthBox = document.getElementById('view-month-container');
            const dayBox = document.getElementById('view-day-container');
            const tabMonth = document.getElementById('tab-month');
            const tabDay = document.getElementById('tab-day');
            
            if (view === 'month') {
                if (monthBox) monthBox.classList.remove('hidden');
                if (dayBox) dayBox.classList.add('hidden');
                if (tabMonth) tabMonth.className = "px-2 py-1 rounded font-medium transition cursor-pointer bg-indigo-600 text-white";
                if (tabDay) tabDay.className = "px-2 py-1 rounded font-medium transition cursor-pointer text-gray-400 hover:text-gray-200";
            } else {
                if (monthBox) monthBox.classList.add('hidden');
                if (dayBox) dayBox.classList.remove('hidden');
                if (tabMonth) tabMonth.className = "px-2 py-1 rounded font-medium transition cursor-pointer text-gray-400 hover:text-gray-200";
                if (tabDay) tabDay.className = "px-2 py-1 rounded font-medium transition cursor-pointer bg-indigo-600 text-white";
            }
        }

        function selectCalendarDay(dateStr) {
            selectedDateContext = new Date(dateStr);
            renderCalendar();
        }

        function renderCalendar() {
            const year = selectedDateContext.getFullYear();
            const month = selectedDateContext.getMonth();
            const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            
            if (document.getElementById('widget-title')) document.getElementById('widget-title').innerText = `${monthNames[month]} ${year}`;
            if (document.getElementById('mobile-month-title')) document.getElementById('mobile-month-title').innerText = `${monthNames[month]} ${year}`;
            
            const firstDayIndex = new Date(year, month, 1).getDay();
            const totalDays = new Date(year, month + 1, 0).getDate();
            
            let daysHtml = "";
            for (let i = 0; i < firstDayIndex; i++) {
                daysHtml += `<div class="p-1 text-gray-700"></div>`;
            }
            
            const todayStr = new Date().toISOString().split('T')[0];
            const activeSelStr = selectedDateContext.toISOString().split('T')[0];
            
            for (let day = 1; day <= totalDays; day++) {
                const currentLoopDateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const hasTasks = schedule.some(item => item.date === currentLoopDateStr);
                
                let dayClass = "p-1.5 rounded-lg cursor-pointer transition hover:bg-gray-800 text-gray-300 relative ";
                if (currentLoopDateStr === todayStr) {
                    dayClass += "bg-indigo-900/60 text-indigo-400 border border-indigo-500/50 font-bold ";
                } else if (currentLoopDateStr === activeSelStr) {
                    dayClass += "bg-gray-800 text-white border border-gray-700 ";
                }
                
                let dotHtml = hasTasks ? `<span class="absolute bottom-0.5 left-1/2 -translate-x-1/2 w-1 h-1 bg-indigo-400 rounded-full"></span>` : "";
                daysHtml += `<div class="${dayClass}" onclick="selectCalendarDay('${currentLoopDateStr}')">${day}${dotHtml}</div>`;
            }
            
            if (document.getElementById('calendar-days-grid')) document.getElementById('calendar-days-grid').innerHTML = daysHtml;
            if (document.getElementById('mobile-calendar-days-grid')) document.getElementById('mobile-calendar-days-grid').innerHTML = daysHtml;
            
            renderAgendaSummary(activeSelStr);
            renderHourlyTimeline(activeSelStr);
        }

        function renderAgendaSummary(dateStr) {
            const dayTasks = schedule.filter(item => item.date === dateStr);
            if (document.getElementById('widget-subtitle')) {
                document.getElementById('widget-subtitle').innerText = `${dayTasks.length} assigned tasks`;
            }
            
            const agendaContainer = document.getElementById('widget-mini-agenda');
            if (agendaContainer) {
                if (dayTasks.length === 0) {
                    agendaContainer.innerHTML = `<p class="text-gray-600 text-[10px] italic">No tasks for this day.</p>`;
                } else {
                    agendaContainer.innerHTML = dayTasks.map(t => `
                        <div class="flex items-center gap-1.5 truncate">
                            <span class="w-1.5 h-1.5 rounded-full ${t.completed ? 'bg-gray-600' : 'bg-indigo-400'}"></span>
                            <span class="${t.completed ? 'line-through text-gray-600' : ''}">${t.name}</span>
                        </div>
                    `).join('');
                }
            }
        }

        function renderHourlyTimeline(dateStr) {
            const dayTasks = schedule.filter(item => item.date === dateStr);
            const allDayTasks = dayTasks.filter(t => t.isAllDay);
            const timedTasks = dayTasks.filter(t => !t.isAllDay);
            
            const bannerMarkup = allDayTasks.map(t => `
                <div class="text-[11px] bg-indigo-950/80 text-indigo-300 border border-indigo-800/60 px-2 py-1 rounded font-medium">
                    <span class="${t.completed ? 'line-through text-gray-500' : ''}">🌟 ${t.name}</span>
                </div>
            `).join('');
            
            const desktopBanner = document.getElementById('widget-allday-banner-wrapper');
            const mobileBanner = document.getElementById('mobile-allday-banner-wrapper');
            
            if (allDayTasks.length > 0) {
                if (desktopBanner) { desktopBanner.innerHTML = bannerMarkup; desktopBanner.classList.remove('hidden'); }
                if (mobileBanner) { mobileBanner.innerHTML = bannerMarkup; mobileBanner.classList.remove('hidden'); }
            } else {
                if (desktopBanner) desktopBanner.classList.add('hidden');
                if (mobileBanner) mobileBanner.classList.add('hidden');
            }
            
            let backgroundLines = "";
            for (let h = 0; h < 24; h++) {
                backgroundLines += `
                    <div class="absolute w-full border-t border-gray-800/30 flex items-start text-[9px] text-gray-600 pl-1" style="top: ${h * 40}px; height: 40px;">
                        ${String(h).padStart(2, '0')}:00
                    </div>
                `;
            }
            
            const tasksMarkup = timedTasks.map(t => {
                if (!t.fromTime) return '';
                const [fH, fM] = t.fromTime.split(':').map(Number);
                const [tH, tM] = t.toTime ? t.toTime.split(':').map(Number) : [fH + 1, fM];
                
                const startMins = fH * 60 + fM;
                let endMins = tH * 60 + tM;
                if (endMins <= startMins) endMins = startMins + 60;
                
                const topPos = (startMins / 60) * 40;
                const heightPos = ((endMins - startMins) / 60) * 40;
                
                let colorClasses = "bg-indigo-600/20 text-indigo-300 border border-indigo-500/40";
                if (t.category === 'Homework') colorClasses = "bg-blue-600/20 text-blue-300 border border-blue-500/40";
                if (t.category === 'Self-Study') colorClasses = "bg-purple-600/20 text-purple-300 border border-purple-500/40";
                if (t.category === 'Tuition') colorClasses = "bg-emerald-600/20 text-emerald-300 border border-emerald-500/40";
                if (t.category === 'Free Time') colorClasses = "bg-amber-600/20 text-amber-300 border border-amber-500/40";
                
                return `
                    <div class="absolute left-10 right-2 p-1 rounded text-[10px] overflow-hidden font-medium ${colorClasses} ${t.completed ? 'opacity-30 line-through' : ''}" style="top: ${topPos}px; height: ${heightPos}px;">
                        <div class="truncate font-bold">${t.name}</div>
                    </div>
                `;
            }).join('');
            
            const dContainer = document.getElementById('hourly-timeline-container');
            const mContainer = document.getElementById('mobile-hourly-timeline-container');
            
            if (dContainer) dContainer.innerHTML = backgroundLines + tasksMarkup;
            if (mContainer) mContainer.innerHTML = backgroundLines + tasksMarkup;

            updateTimeTrackerLine();
        }

        function updateTimeTrackerLine() {
            const dContainer = document.getElementById('hourly-timeline-container');
            const mContainer = document.getElementById('mobile-hourly-timeline-container');
            if (!dContainer && !mContainer) return;

            document.querySelectorAll('.live-time-tracker').forEach(el => el.remove());

            const todayStr = new Date().toISOString().split('T')[0];
            const activeSelStr = selectedDateContext.toISOString().split('T')[0];
            if (todayStr !== activeSelStr) return;

            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes();
            const totalMinutes = hours * 60 + minutes;
            const topPos = (totalMinutes / 60) * 40;

            const currentClockStr = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`;
            const activeTask = schedule.find(t => {
                if (t.date !== todayStr || t.isAllDay || t.completed || !t.fromTime || !t.toTime) return false;
                return currentClockStr >= t.fromTime && currentClockStr <= t.toTime;
            });

            const currentLabelText = activeTask ? `Now: ${activeTask.name}` : 'No Ongoing Activity';

            const trackerMarkup = `
                <div class="live-time-tracker absolute left-0 right-0 z-20 flex items-center pointer-events-none" style="top: ${topPos - 6}px;">
                    <div class="w-2.5 h-2.5 rounded-full bg-rose-500 border border-black shadow-[0_0_8px_#f43f5e] shrink-0 animate-ping absolute"></div>
                    <div class="w-2.5 h-2.5 rounded-full bg-rose-500 border border-black shadow-[0_0_4px_#f43f5e] shrink-0"></div>
                    <div class="flex-1 border-t-2 border-dashed border-rose-500/80 drop-shadow-[0_1px_2px_rgba(0,0,0,0.8)]"></div>
                    <span class="bg-rose-600 text-white text-[8px] font-black uppercase px-1 py-0.5 rounded ml-1 border border-rose-400 max-w-[110px] truncate select-none shadow-md tracking-wider">
                        ${currentLabelText}
                    </span>
                </div>
            `;

            if (dContainer) dContainer.insertAdjacentHTML('beforeend', trackerMarkup);
            if (mContainer) mContainer.insertAdjacentHTML('beforeend', trackerMarkup);
        }

        function saveAndRender() {
            localStorage.setItem('study_schedule', JSON.stringify(schedule));
            localStorage.setItem('study_syllabus', JSON.stringify(syllabus));
            renderSchedule();
            renderSyllabus();
            renderCalendar();
        }

        saveAndRender();
    </script>
</body>
</html>
